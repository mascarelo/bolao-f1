name: Gerar APK

on:
  workflow_dispatch:
  repository_dispatch:
    types: [novo-codigo]
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar o código do app no repositório privado
        uses: actions/checkout@v4
        with:
          repository: mascarelo/bolao-f1-codigo
          token: ${{ secrets.PAT_CODIGO }}
          path: fonte
      - name: Copiar o código para a pasta de trabalho
        run: |
          for f in index.html package.json capacitor.config.json icon.png; do
            test -f "fonte/$f" || { echo "ERRO: faltou $f no repositório privado"; exit 1; }
            cp "fonte/$f" .
          done
          rm -rf fonte
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar projeto Android
        run: |
          mkdir -p www
          cp index.html www/
          echo '{"build": ${{ github.run_number }}}' > www/versao.json
          npm install
          npx cap add android
          npx cap sync android
      - name: Numerar a versão do app (o Android só atualiza por cima se o número aumentar)
        run: |
          f=android/app/build.gradle
          sed -i -E "s/versionCode[ =]+[0-9]+/versionCode ${{ github.run_number }}/; s/versionName[ =]+\"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" "$f"
          grep -E "versionCode|versionName" "$f"
          grep -q "versionCode ${{ github.run_number }}" "$f" || { echo "ERRO: não consegui numerar a versão do app"; exit 1; }
      - name: Aplicar ícone do app
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import glob, os
          res = 'android/app/src/main/res'
          for f in glob.glob(res + '/mipmap-anydpi-v26/*'):
              os.remove(f)
          im = Image.open('icon.png').convert('RGBA')
          for d, s in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              p = f'{res}/mipmap-{d}'
              os.makedirs(p, exist_ok=True)
              r = im.resize((s, s), Image.LANCZOS)
              for n in ('ic_launcher', 'ic_launcher_round', 'ic_launcher_foreground'):
                  r.save(f'{p}/{n}.png')
          PY
      - name: Atualização dentro do app (baixa o APK novo e abre o instalador do Android)
        run: |
          mkdir -p android/app/src/main/java/com/bolao/f1 android/app/src/main/res/xml
          cat > android/app/src/main/java/com/bolao/f1/AtualizadorPlugin.java <<'JAVA'
          package com.bolao.f1;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.BufferedInputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          @CapacitorPlugin(name = "Atualizador")
          public class AtualizadorPlugin extends Plugin {
              private volatile boolean cancelado = false;

              private File arquivo() {
                  File dir = new File(getContext().getCacheDir(), "atualizacao");
                  if (!dir.exists()) dir.mkdirs();
                  return new File(dir, "lista-de-mercado.apk");
              }

              @PluginMethod
              public void podeInstalar(PluginCall call) {
                  boolean ok = Build.VERSION.SDK_INT < Build.VERSION_CODES.O
                      || getContext().getPackageManager().canRequestPackageInstalls();
                  JSObject r = new JSObject();
                  r.put("value", ok);
                  call.resolve(r);
              }

              @PluginMethod
              public void abrirPermissao(PluginCall call) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          Intent i = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                              Uri.parse("package:" + getContext().getPackageName()));
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(i);
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Não consegui abrir a tela de permissão: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void baixar(final PluginCall call) {
                  final String endereco = call.getString("url");
                  if (endereco == null || endereco.isEmpty()) { call.reject("Endereço do APK não informado"); return; }
                  cancelado = false;
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          HttpURLConnection c = null;
                          File tmp = null;
                          try {
                              URL u = new URL(endereco);
                              // o GitHub redireciona para outro servidor: segue até 8 redirecionamentos
                              for (int i = 0; ; i++) {
                                  c = (HttpURLConnection) u.openConnection();
                                  c.setInstanceFollowRedirects(false);
                                  c.setConnectTimeout(20000);
                                  c.setReadTimeout(30000);
                                  c.setRequestProperty("User-Agent", "ListaDeMercado-Android");
                                  int code = c.getResponseCode();
                                  if (code >= 300 && code < 400 && i < 8) {
                                      String loc = c.getHeaderField("Location");
                                      c.disconnect();
                                      if (loc == null) throw new IOException("Redirecionamento sem destino");
                                      u = new URL(u, loc);
                                      continue;
                                  }
                                  if (code != 200) throw new IOException("O servidor respondeu " + code);
                                  break;
                              }
                              long total = c.getContentLengthLong();
                              File destino = arquivo();
                              tmp = new File(destino.getPath() + ".parcial");
                              InputStream in = new BufferedInputStream(c.getInputStream());
                              OutputStream out = new FileOutputStream(tmp);
                              try {
                                  byte[] buf = new byte[65536];
                                  long lidos = 0;
                                  int n, ultimo = -2;
                                  long ultimoAviso = 0;
                                  while ((n = in.read(buf)) != -1) {
                                      if (cancelado) throw new IOException("cancelado");
                                      out.write(buf, 0, n);
                                      lidos += n;
                                      int pct = total > 0 ? (int) (lidos * 100 / total) : -1;
                                      long agora = System.currentTimeMillis();
                                      if (pct != ultimo || (pct < 0 && agora - ultimoAviso > 300)) {
                                          ultimo = pct;
                                          ultimoAviso = agora;
                                          JSObject p = new JSObject();
                                          p.put("pct", pct);
                                          p.put("baixados", lidos);
                                          p.put("total", total);
                                          notifyListeners("progresso", p);
                                      }
                                  }
                              } finally {
                                  try { in.close(); } catch (Exception ignored) {}
                                  try { out.close(); } catch (Exception ignored) {}
                              }
                              if (destino.exists()) destino.delete();
                              if (!tmp.renameTo(destino)) throw new IOException("Não consegui salvar o arquivo baixado");
                              JSObject r = new JSObject();
                              r.put("tamanho", destino.length());
                              call.resolve(r);
                          } catch (Exception e) {
                              if (tmp != null && tmp.exists()) tmp.delete();
                              String m = e.getMessage();
                              call.reject(m == null || m.isEmpty() ? "Erro no download" : m);
                          } finally {
                              if (c != null) c.disconnect();
                          }
                      }
                  }).start();
              }

              @PluginMethod
              public void cancelar(PluginCall call) {
                  cancelado = true;
                  call.resolve();
              }

              @PluginMethod
              public void instalar(PluginCall call) {
                  try {
                      File f = arquivo();
                      if (!f.exists()) { call.reject("Arquivo da atualização não encontrado"); return; }
                      Uri uri = FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".fileprovider", f);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(uri, "application/vnd.android.package-archive");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Não consegui abrir o instalador: " + e.getMessage());
                  }
              }
          }
          JAVA
          # pastas que o instalador pode ler (inclui a pasta de cache onde o APK é baixado)
          cat > android/app/src/main/res/xml/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="my_images" path="." />
              <cache-path name="my_cache_images" path="." />
          </paths>
          XML
          # permissão para pedir a instalação de atualizações
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perm = '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          if 'REQUEST_INSTALL_PACKAGES' not in s:
              s = s.replace('<application', perm + '\n    <application', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -q REQUEST_INSTALL_PACKAGES android/app/src/main/AndroidManifest.xml
          grep -q 'androidx.core.content.FileProvider' android/app/src/main/AndroidManifest.xml || { echo "ERRO: o projeto Android não tem o FileProvider esperado"; exit 1; }
      - name: Ajustar bordas da tela (barra de navegação do Android)
        run: |
          cat > android/app/src/main/java/com/bolao/f1/MainActivity.java <<'JAVA'
          package com.bolao.f1;

          import android.os.Bundle;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.LayerDrawable;
          import android.view.Gravity;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AtualizadorPlugin.class); // atualização do app sem passar pelo navegador
                  super.onCreate(savedInstanceState);
                  View root = findViewById(android.R.id.content);
                  root.setBackgroundColor(0xFF0F0F14);
                  ViewCompat.setOnApplyWindowInsetsListener(root, (v, insets) -> {
                      Insets s = insets.getInsets(
                          WindowInsetsCompat.Type.systemBars()
                          | WindowInsetsCompat.Type.displayCutout()
                          | WindowInsetsCompat.Type.ime());
                      v.setPadding(s.left, s.top, s.right, s.bottom);
                      LayerDrawable ld = new LayerDrawable(new Drawable[] {
                          new ColorDrawable(0xFF0F0F14), new ColorDrawable(0xFFE10600) });
                      ld.setLayerGravity(1, Gravity.TOP | Gravity.FILL_HORIZONTAL);
                      ld.setLayerHeight(1, s.top);
                      v.setBackground(ld);
                      return WindowInsetsCompat.CONSUMED;
                  });
                  WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), root);
                  if (c != null) {
                      c.setAppearanceLightStatusBars(false);
                      c.setAppearanceLightNavigationBars(false);
                  }
              }
          }
          JAVA
      - name: Usar a chave de assinatura fixa
        env:
          CHAVE: ${{ secrets.CHAVE_ASSINATURA }}
        run: |
          mkdir -p ~/.android
          if [ -z "$CHAVE" ]; then
            echo "ERRO: o segredo CHAVE_ASSINATURA está vazio ou não existe. Sem ele cada APK sai com uma chave diferente e o Android não atualiza por cima."
            exit 1
          fi
          echo "$CHAVE" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | tail -2
      - name: Mandar o Gradle assinar com essa chave
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publicar APK na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Bolão F1 (versão ${{ github.run_number }})
          files: android/app/build/outputs/apk/debug/app-debug.apk
