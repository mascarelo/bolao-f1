name: Gerar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'icon.png'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar projeto Android
        run: |
          mkdir -p www
          cp index.html www/
          npm install
          npx cap add android
          npx cap sync android
      - name: Aplicar ícone do app
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import glob, os
          res = 'android/app/src/main/res'
          for f in glob.glob(res + '/mipmap-anydpi-v26/*'):
              os.remove(f)
          im = Image.open('icon.png').convert('RGBA')
          for d, s in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              p = f'{res}/mipmap-{d}'
              os.makedirs(p, exist_ok=True)
              r = im.resize((s, s), Image.LANCZOS)
              for n in ('ic_launcher', 'ic_launcher_round', 'ic_launcher_foreground'):
                  r.save(f'{p}/{n}.png')
          PY
      - name: Usar a chave de assinatura fixa
        env:
          CHAVE: ${{ secrets.CHAVE_ASSINATURA }}
        run: |
          mkdir -p ~/.android
          echo "$CHAVE" | base64 -d > ~/.android/debug.keystore
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publicar APK na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Bolão F1 (versão ${{ github.run_number }})
          files: android/app/build/outputs/apk/debug/app-debug.apk
