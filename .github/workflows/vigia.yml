name: Vigia dos avisos
on:
  schedule:
    - cron: '7,37 * * * 4,5,6,0,1'   # de quinta a segunda (UTC); o proprio robo confere a janela exata em horario de Brasilia
  workflow_dispatch:
permissions:
  actions: write
# Revezamento: so um vigia roda; o proximo fica na fila e assume assim que o anterior terminar (sem lacuna).
concurrency:
  group: vigia
  cancel-in-progress: false
jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save firebase-admin
      - name: Vigiar
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SEMPRE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          VIGIA_SEMPRE="$SEMPRE" GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" node avisos/vigia.js
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Manter o agendamento ativo (o GitHub desliga agendamentos de repositorios parados ha 60 dias)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/vigia.yml/enable || true
