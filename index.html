<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolão F1 by Mascarelo</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style id="css">
:root{box-sizing:border-box;--bg:#f2f2f4;--cd:#fff;--fg:#15151e;--mut:#6b6b78;--ac:#e10600;--ok:#1a8f3c;--st:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sb:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));padding-top:var(--st);padding-bottom:var(--sb)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f14;--cd:#1a1a22;--fg:#f2f2f4;--mut:#9a9aa8;--ok:#7be495}}
:root[data-theme="dark"]{--bg:#0f0f14;--cd:#1a1a22;--fg:#f2f2f4;--mut:#9a9aa8;--ok:#7be495}
*{box-sizing:border-box}html{scroll-padding-top:var(--st)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px Roboto,"Segoe UI",Arial,sans-serif}
#app{width:100%;display:flex;flex-direction:column;min-height:100vh;padding-bottom:104px}
:root{--maxw:640px;--px:max(16px,calc((100% - var(--maxw))/2 + 16px));--pxb:max(12px,calc((100% - var(--maxw))/2 + 12px))}
.top{order:0}.nav{order:1}#app>.b{order:2}
.top{background:var(--ac);color:#fff;padding:14px var(--px);font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top small{display:block;font-weight:400;font-size:12px;opacity:.9}
.top button{background:#fff3;color:#fff;border:0;border-radius:16px;padding:7px 12px;font-size:12px}
.b{padding:12px var(--pxb)}
.b .add select{max-width:340px}.add{max-width:600px}
.card{background:var(--cd);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.g{flex:1;min-width:0}.g .t{overflow:hidden;text-overflow:ellipsis}.t{font-weight:600}.m{color:var(--mut);font-size:12px;margin-top:2px}
.chip{font-size:11px;padding:3px 9px;border-radius:10px;background:#1a8f3c22;color:var(--ok)}.chip.n{background:#e1060022;color:#ff6a62}.chip.p{background:#e8b50022;color:#d49b00}
.av{width:36px;height:36px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.num{font-weight:700;font-size:16px}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:6px 0 14px}
.pod>div{flex:1;max-width:clamp(110px,22vw,170px);text-align:center;border-radius:12px 12px 0 0;padding:8px 2px;background:var(--cd)}
.pod .a{height:148px;background:linear-gradient(#e1060055,var(--cd))}.pod .b2{height:132px}.pod .c{height:118px}
.pod .av{margin:0 auto 4px}.pod strong{display:block;font-size:17px}
.pill{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.pill button{flex:1;white-space:nowrap;padding:8px 12px;border-radius:18px;border:0;background:var(--cd);color:var(--mut);font-size:13px}.pill .on{background:var(--ac);color:#fff}
.fld{background:var(--cd);border-radius:12px;padding:6px 12px;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.fld i{font-style:normal;width:36px;color:var(--mut);font-size:12px}.fld em{font-style:normal;font-weight:700;color:var(--ok);min-width:30px;text-align:right}
select,input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid #8884;border-radius:10px;padding:9px;width:100%}
.fld select{border:0;background:transparent;padding:6px 0}
select:disabled{opacity:1;-webkit-text-fill-color:var(--fg);-webkit-appearance:none;appearance:none}
.btn{display:block;width:100%;background:var(--ac);color:#fff;border:0;border-radius:24px;padding:12px;font-weight:700;font-size:15px;margin-top:8px}
.ib{background:none;border:0;font-size:17px;padding:4px}
.rule{background:var(--cd);border-radius:12px;padding:9px;text-align:center;color:var(--mut);font-size:12px;margin-top:8px}
.sec{color:var(--mut);font-size:11px;letter-spacing:.8px;text-transform:uppercase;margin:12px 2px 6px}
.add{display:flex;gap:6px;margin-bottom:10px}.add button{flex:none;width:auto;padding:0 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid #8883;padding:0 var(--px) calc(var(--sb) + 14px)}
.nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0 7px;font-size:11px}.nav b{display:block;font-size:19px;font-weight:400}.nav .on{color:var(--ac)}
.bar{position:fixed;left:12px;right:12px;bottom:calc(80px + var(--sb));max-width:min(496px,calc(100% - 24px));margin:0 auto;background:#222;color:#fff;border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px #0006}
.bar span{flex:1;font-size:13px}.bar button{background:var(--ac);color:#fff;border:0;border-radius:18px;padding:9px 16px;font-weight:700}

/* ===== Layout responsivo ===== */
@media (min-width:600px){
 .t1,.t2,.t3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 12px;align-content:start}
 .t1>*,.t2>*,.t3>*{grid-column:1/-1}.t1>.card,.t2>.card,.t3>.card{grid-column:auto}
 .t4{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0 12px;align-content:start}
 .t4>select,.t4>.pill,.t4>.card,.t4>.rule,.t4>.btn{grid-column:1/-1}.t4>select{max-width:420px}
 .tc>.card{max-width:560px}
}
@media (min-width:700px){
 :root{--maxw:900px}
 body{font-size:15px}
 .top{font-size:21px;padding-top:18px;padding-bottom:18px}.top small{font-size:13px}.top button{font-size:13px;padding:8px 14px}
 .card{padding:12px 16px}.t{font-size:15px}.m{font-size:13px}.num{font-size:18px}.chip{font-size:12px}
 .av{width:42px;height:42px}.pod strong{font-size:20px}.pod .a{height:170px}.pod .b2{height:150px}.pod .c{height:132px}
 .fld{padding:8px 14px}.fld i{width:44px;font-size:13px}.rule{font-size:13px}
 .pill button{font-size:14px;padding:9px 14px}.nav button{font-size:12px}.nav b{font-size:22px}
}
@media (min-width:900px){
 #app{padding-bottom:28px}
 .nav{position:static;gap:4px;border-top:0;border-bottom:1px solid #8883;padding-bottom:0}
 .nav button{flex:none;display:flex;align-items:center;gap:8px;padding:13px 20px;font-size:14px;border-bottom:3px solid transparent}
 .nav b{display:inline;font-size:20px}.nav .on{border-bottom-color:var(--ac);font-weight:700}
 .bar{bottom:calc(24px + var(--sb))}
 .t0{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:0 28px;align-items:start}
 .t0>.pod{grid-column:1}.t0>.rule{grid-column:2;grid-row:1/span 10;margin-top:0;align-self:start}
}
@media (min-width:1100px){
 :root{--maxw:1180px}
 body{font-size:16px}
 .top{font-size:24px}.t{font-size:16px}.m{font-size:14px}.num{font-size:19px}
 .t1,.t2,.t3{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
 .pod .a{height:190px}.pod .b2{height:168px}.pod .c{height:148px}
}
@media (max-height:480px) and (orientation:landscape){
 .pod .a{height:120px}.pod .b2{height:106px}.pod .c{height:94px}
 .top{padding-top:8px;padding-bottom:8px;font-size:17px}.top small{font-size:11px}.nav b{font-size:17px}.nav button{padding-top:4px;padding-bottom:3px}.nav{padding-bottom:calc(var(--sb) + 6px)}
 #app{padding-bottom:64px}
}

#splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:linear-gradient(#e10600 0%,#5c0a12 42%,#0f0f14 100%);transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:min(68vw,45vh,360px);height:auto;filter:drop-shadow(0 10px 28px #000a);animation:spin .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes spin{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
</style></head><body>

<script id="js">
const SPL=2000;
setTimeout(()=>{const s=document.getElementById('splash');if(!s)return;s.classList.add('out');setTimeout(()=>s.remove(),400)},SPL);
const $=i=>document.getElementById(i);let R={seasons:[]};
const PTS=[5,25,18,15,12,10],LB=['Pole','1º','2º','3º','4º','5º'],MED=['🥇','🥈','🥉'];
const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const done=r=>r.st!='x'&&r.res.length==6&&r.res.every(Boolean);
const sc=(r,id)=>r.st=='x'?0:(r.pk[id]||[]).reduce((a,p,i)=>a+(p&&p===r.res[i]?PTS[i]:0),0);
const tot=id=>S.races.reduce((a,r)=>a+sc(r,id),0),cnt=id=>S.races.filter(r=>sc(r,id)>0).length;
let tab=0,canEdit=false,edit=false,dirty=false,cf='',ren='',mode='pk',msg='';
try{tab=+sessionStorage.getItem('t')||0}catch(_){}
let ri=0,pid,S,ns=false;
function useS(y){S=R.seasons.find(s=>s.y==y)||R.seasons[R.seasons.length-1]||{y:new Date().getFullYear(),races:[],drivers:[],people:[]};ri=Math.max(0,S.races.map(done).lastIndexOf(true));pid=(S.people[0]||{}).id}
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
if(NATIVE){document.documentElement.style.setProperty('--st','0px');document.documentElement.style.setProperty('--sb','0px')}
let cfg={},sha='',loading=true,cs=false,ys='';try{cfg=JSON.parse(localStorage.getItem('cfg')||'{}')}catch(_){}
const GH=()=>`https://api.github.com/repos/${cfg.u}/${cfg.r}/contents/data.json`,HD=()=>({Authorization:'Bearer '+cfg.t,Accept:'application/vnd.github+json'});
async function load(){
 try{let d;sha='';
  if(NATIVE&&cfg.t&&cfg.u&&cfg.r){const x=await fetch(GH()+'?t='+Date.now(),{headers:HD(),cache:'no-store'});if(!x.ok)throw 0;const j=await x.json();sha=j.sha;d=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))))}
  else{const b=NATIVE&&cfg.u&&cfg.r?`https://${cfg.u}.github.io/${cfg.r}/`:'';const x=await fetch(b+'data.json?t='+Date.now(),{cache:'no-store'});if(!x.ok)throw 0;d=await x.json()}
  R=d;msg='';try{localStorage.setItem('cache',JSON.stringify(d))}catch(_){}
 }catch(_){try{const c=JSON.parse(localStorage.getItem('cache'));if(c)R=c;msg='Sem conexão: mostrando os últimos dados'}catch(__){}}
 R.seasons.sort((a,b)=>a.y-b.y);canEdit=NATIVE&&!!sha;if(NATIVE&&!cfg.t)msg='Toque em ⚙️ para conectar ao GitHub';loading=false;useS(ys);render()}
try{ys=sessionStorage.getItem('y')}catch(_){}useS(ys);
const ed=()=>canEdit&&edit,dis=()=>ed()?'':'disabled';
const ini=n=>e((n||'?')[0].toUpperCase());
function vRank(){
 const L=S.people.map(p=>({p,t:tot(p.id),c:cnt(p.id)})).sort((a,b)=>b.t-a.t);
 L.forEach((x,i)=>x.pos=i&&x.t==L[i-1].t?L[i-1].pos:i+1);
 const pod=[[1,'b2'],[0,'a'],[2,'c']].filter(([i])=>L[i]).map(([i,c])=>`<div class="${c}"><div class="av">${ini(L[i].p.n)}</div>${e(L[i].p.n)}<strong>${L[i].t}</strong>${MED[i]}</div>`).join('');
 return `<div class="pod">${pod}</div>`+L.map(x=>`<div class="card"><span class="num" style="width:30px">${x.pos<4?MED[x.pos-1]:x.pos+'º'}</span><div class="g"><div class="t">${e(x.p.n)}</div><div class="m">${x.c} corridas pontuadas</div></div><span class="num">${x.t}</span></div>`).join('')+
 `<div class="rule" style="text-align:left;padding:14px 16px;font-size:13px;color:var(--fg)"><div style="font-weight:700;margin-bottom:8px">Regras de pontuação:</div><div style="display:grid;grid-template-columns:56px 1fr;row-gap:4px">${LB.map((l,i)=>`<div>${l}:</div><div>${String(PTS[i]).padStart(2,'0')} pontos</div>`).join('')}</div><div style="margin-top:12px;color:var(--mut)">Pontua somente quem acertar as posições exatas.</div></div>`}
function vRaces(){
 const add=ed()?`<div class="add"><input id="nr" placeholder="Nova corrida (ex.: GP do Japão)"><button data-a="addr">+</button></div>`:'';
 return add+S.races.map((r,i)=>{const c=r.st=='x'?['n','Cancelada']:done(r)?['','Apurada']:['p','Aguardando'];
 return `<div class="card"><span class="m" style="width:22px">${i+1}</span><div class="g" data-a="go" data-i="${i}"><div class="t">${e(r.n)}</div></div><span class="chip ${c[0]}">${c[1]}</span>`+
 (ed()?`<button class="ib" data-a="cx" data-i="${i}" title="Cancelar/reativar">⛔</button><button class="ib" data-a="del" data-k="r${i}">${cf=='r'+i?'❓':'🗑️'}</button>`:'')+`</div>`}).join('')}
function vDrivers(){
 const T={};S.drivers.forEach((d,i)=>(T[d.t]=T[d.t]||[]).push([d,i]));
 const add=ed()?`<div class="add" style="flex-wrap:wrap"><input id="dn" placeholder="Piloto" style="flex:1 1 40%"><input id="dt" list="tl" placeholder="Equipe" style="flex:1 1 40%"><datalist id="tl">${Object.keys(T).map(t=>`<option value="${e(t)}">`).join('')}</datalist><button data-a="addd" style="padding:10px 16px">+</button></div>`:'';
 return add+Object.keys(T).sort().map(t=>`<div class="card" style="display:block"><div class="t" style="margin-bottom:4px">${e(t)}</div>`+T[t].map(([d,i])=>`<div class="m" style="display:flex;justify-content:space-between">🏎️ ${e(d.n)}${ed()?`<button class="ib" style="font-size:13px" data-a="deld" data-i="${i}">✕</button>`:''}</div>`).join('')+`</div>`).join('')}
function vPeople(){
 const add=ed()?`<div class="add"><input id="np" placeholder="Nome do participante"><button data-a="addp">+</button></div>`:'';
 return add+S.people.map(p=>`<div class="card"><div class="av">${ini(p.n)}</div><div class="g">${ren==p.id?`<input id="rn" value="${e(p.n)}">`:`<div class="t">${e(p.n)}</div><div class="m">${tot(p.id)} pontos</div>`}</div>`+
 (ed()?`<button class="ib" data-a="${ren==p.id?'rens':'ren'}" data-k="${p.id}">${ren==p.id?'✔️':'✏️'}</button><button class="ib" data-a="del" data-k="p${p.id}">${cf=='p'+p.id?'❓':'🗑️'}</button>`:'')+`</div>`).join('')}
function vPicks(){
 const r=S.races[ri];if(!r)return '<div class="rule">Cadastre uma corrida primeiro</div>';
 const ds=S.drivers.map(d=>d.n).sort(),isP=mode=='pk',arr=isP?(r.pk[pid]||[]):r.res;
 const f=LB.map((l,k)=>{const v=arr[k]||'',pt=isP&&r.res[k]?(v===r.res[k]?'+'+PTS[k]:'0'):'';
  return `<div class="fld"><i>${l}</i><select ${dis()} data-a="pick" data-k="${k}"><option value="">—</option>${(v&&!ds.includes(v)?[v].concat(ds):ds).map(n=>`<option ${n==v?'selected':''}>${e(n)}</option>`).join('')}</select><em>${pt}</em></div>`}).join('');
 return `<select data-a="race" style="margin-bottom:10px">${S.races.map((x,i)=>`<option value="${i}" ${i==ri?'selected':''}>${e(x.n)}${x.st=='x'?' (cancelada)':''}</option>`).join('')}</select>
 <div class="pill"><button class="${isP?'on':''}" data-a="mode" data-k="pk">Palpites</button><button class="${isP?'':'on'}" data-a="mode" data-k="of">Resultado oficial</button></div>`+
 (isP?`<div class="pill">${S.people.map(p=>`<button class="${p.id==pid?'on':''}" data-a="pid" data-k="${p.id}">${e(p.n)}</button>`).join('')}</div>`:'')+f+
 (isP&&pid?`<div class="card" style="justify-content:space-between"><span>Total da corrida</span><span class="num">${sc(r,pid)} pts</span></div>`:'')+
 (!isP&&ed()?`<div class="rule">Ao salvar, os pontos de todos são recalculados</div>`:'')}
const vCfg=()=>`<div class="card" style="display:block"><div class="t">Conexão com o GitHub</div><div class="m" style="margin:6px 0 10px">Preencha uma vez. Só o administrador precisa disso.</div><input id="cu" placeholder="Seu usuário do GitHub" value="${e(cfg.u||'mascarelo')}" style="margin-bottom:6px"><input id="cr" placeholder="Repositório" value="${e(cfg.r||'bolao-f1')}" style="margin-bottom:6px"><input id="ct" type="password" placeholder="Token de acesso" value="${e(cfg.t||'')}"><button class="btn" data-a="cfgs">Salvar e conectar</button></div>`;
const TABS=[['🏆','Ranking',vRank,'Ranking geral'],['🏁','Corridas',vRaces,'Corridas'],['🏎️','Pilotos',vDrivers,'Equipes e pilotos'],['👥','Pessoas',vPeople,'Participantes'],['✍️','Palpites',vPicks,'Palpites e resultados']];
function render(){
 if(loading){$('app').innerHTML='<div class="b"><div class="rule">Carregando…</div></div>';return}
 const n=S.races.filter(done).length,tt=S.races.filter(r=>r.st!='x').length;
 $('app').innerHTML=`<div class="top"><div>${TABS[tab][3]}<small>${tab==0?S.y+' · '+n+' de '+tt+' corridas apuradas':canEdit?(edit?'Modo edição':'Toque em Editar para alterar'):'Somente consulta'}</small></div><span>${canEdit?`<button data-a="edit">${edit?'👁️ Concluir':'✏️ Editar'}</button> `:''}${NATIVE?'<button data-a="cfg">⚙️</button>':''}</span></div>
 <div class="b" style="padding-bottom:0"><div class="add" style="margin:0"><select data-a="season">${R.seasons.map(s=>`<option value="${s.y}" ${s===S?'selected':''}>Temporada ${s.y}</option>`).join('')}</select>${ed()?`<button data-a="ns">➕ Nova</button>`:''}${ed()&&R.seasons.length>1?`<button class="ib" data-a="del" data-k="s">${cf=='s'?'❓':'🗑️'}</button>`:''}</div>${ns&&ed()?`<div class="card" style="display:block;margin-top:8px"><input id="ny" type="number" placeholder="Ano da nova temporada (ex.: ${S.y+1})"><label class="m" style="display:block;margin:8px 0"><input type="checkbox" id="nc" checked style="width:auto"> Copiar pilotos e participantes de ${S.y}</label><button class="btn" style="margin:0" data-a="mk">Criar temporada</button></div>`:''}</div>
 <div class="b ${cs?'tc':'t'+tab}">${cs?vCfg():TABS[tab][2]()}</div>${dirty?`<div class="bar"><span>${e(msg)||'Alterações não salvas'}</span><button data-a="save">Salvar</button></div>`:(msg?`<div class="bar"><span>${e(msg)}</span></div>`:'')}
 <div class="nav">${TABS.map((t,i)=>`<button class="${i==tab?'on':''}" data-a="tab" data-i="${i}"><b>${t[0]}</b>${t[1]}</button>`).join('')}</div>`}
const val=i=>($(i)||{value:''}).value.trim(),nid=()=>'p'+Date.now().toString(36);
const A={
 tab(d){tab=+d.i;try{sessionStorage.setItem('t',tab)}catch(_){}},
 edit(){edit=!edit;cf='';ren=''},
 go(d){ri=+d.i;A.tab({i:4})},
 season(d,v){useS(v);cf='';ren='';try{sessionStorage.setItem('y',S.y)}catch(_){}},ns(){ns=!ns},
 mk(){const y=+val('ny');if(!y||R.seasons.some(s=>s.y==y)){msg='Ano inválido ou já existe';return}const c=$('nc').checked,k=o=>c?JSON.parse(JSON.stringify(o)):[];
  R.seasons.push({y,races:[],drivers:k(S.drivers),people:k(S.people)});R.seasons.sort((a,b)=>a.y-b.y);useS(y);try{sessionStorage.setItem('y',y)}catch(_){}ns=false;dirty=true},
 race(d,v){ri=+v},mode(d){mode=d.k},pid(d){pid=d.k},
 pick(d,v){const r=S.races[ri];if(mode=='pk'){const a=r.pk[pid]=r.pk[pid]||['','','','','',''];a[+d.k]=v}else r.res[+d.k]=v;dirty=true},
 addr(){const n=val('nr');if(n){S.races.push({n,st:'',res:['','','','','',''],pk:{}});dirty=true}},
 cx(d){const r=S.races[+d.i];r.st=r.st=='x'?'':'x';dirty=true},
 addd(){const n=val('dn'),t=val('dt');if(n&&t){S.drivers.push({n,t});dirty=true}},
 deld(d){S.drivers.splice(+d.i,1);dirty=true},
 addp(){const n=val('np');if(n){const id=nid();S.people.push({id,n});if(!pid)pid=id;dirty=true}},
 ren(d){ren=d.k},rens(d){const n=val('rn');if(n){S.people.find(p=>p.id==d.k).n=n;dirty=true}ren=''},
 del(d){if(cf!=d.k){cf=d.k;return}cf='';
  if(d.k=='s'){R.seasons.splice(R.seasons.indexOf(S),1);useS();try{sessionStorage.setItem('y',S.y)}catch(_){}}
  else if(d.k[0]=='r'){S.races.splice(+d.k.slice(1),1);ri=Math.min(ri,Math.max(0,S.races.length-1))}
  else{const id=d.k.slice(1);S.people=S.people.filter(p=>p.id!=id);S.races.forEach(r=>delete r.pk[id]);if(pid==id)pid=(S.people[0]||{}).id}
  dirty=true},
 cfg(){cs=!cs},
 async cfgs(){cfg={u:val('cu'),r:val('cr'),t:val('ct')};try{localStorage.setItem('cfg',JSON.stringify(cfg))}catch(_){}cs=false;loading=true;render();await load()},
 async save(){
  try{const x=await fetch(GH(),{method:'PUT',headers:HD(),body:JSON.stringify({message:'Atualiza dados do bolão',content:btoa(unescape(encodeURIComponent(JSON.stringify(R,null,1)))),sha})});
   if(x.status==409||x.status==422)throw 'Os dados mudaram no GitHub. Feche e abra o app e refaça a alteração.';
   if(!x.ok)throw 'Erro '+x.status+' ao salvar. Confira o token.';
   sha=(await x.json()).content.sha;dirty=false;msg='Salvo! O site atualiza em ~1 minuto';try{localStorage.setItem('cache',JSON.stringify(R))}catch(_){}
  }catch(x){msg=typeof x=='string'?x:'Sem conexão. Tente de novo.'}}
};
document.addEventListener('click',async ev=>{const t=ev.target.closest('[data-a]');if(!t||t.tagName=='SELECT')return;
 msg='';if(t.dataset.a!='del')cf='';await A[t.dataset.a](t.dataset);render()});
document.addEventListener('change',ev=>{const t=ev.target;if(t.tagName=='SELECT'&&t.dataset.a){A[t.dataset.a](t.dataset,t.value);render()}});
render();load();
</script></body></html>
